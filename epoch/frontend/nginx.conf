server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    include /etc/nginx/locations.conf;
}

# HTTPS mit selbstsigniertem Zertifikat — nötig für Browser-APIs, die einen
# Secure Context verlangen (z.B. Document Picture-in-Picture, s. FloatingWidget.jsx).
# Zertifikat wird vom Entrypoint-Skript beim ersten Start erzeugt, falls es
# noch nicht existiert (docker-entrypoint.sh), und liegt im Bind-Mount ./data,
# bleibt also über Container-Neustarts/-Rebuilds hinweg erhalten.
server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    include /etc/nginx/locations.conf;
}
